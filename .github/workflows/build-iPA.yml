name: Build IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: |
          xcodebuild -project appdb.xcodeproj -list

      - name: Install CocoaPods (if Podfile exists)
        run: |
          if [ -f "Podfile" ]; then
            gem install cocoapods
            pod install
            echo "USE_WORKSPACE=true" >> $GITHUB_ENV
          else
            echo "USE_WORKSPACE=false" >> $GITHUB_ENV
          fi

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -project appdb.xcodeproj \
            -scheme appdb \
            -resolvePackageDependencies \
            || true

      - name: Build archive (no signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project appdb.xcodeproj \
            -scheme appdb \
            -configuration ${{ github.event.inputs.configuration }} \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ runner.temp }}/appdb.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build.log | xcpretty --color --report junit \
            || (cat build.log && exit 1)

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA manually
        run: |
          mkdir -p ${{ runner.temp }}/ipa/Payload
          APP_PATH=$(find ${{ runner.temp }}/appdb.xcarchive -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          cp -r "$APP_PATH" ${{ runner.temp }}/ipa/Payload/
          cd ${{ runner.temp }}/ipa
          zip -r ../appdb.ipa Payload
          echo "IPA created at: ${{ runner.temp }}/appdb.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: appdb-ipa-${{ github.event.inputs.configuration }}-${{ github.run_number }}
          path: ${{ runner.temp }}/appdb.ipa
          retention-days: 7
          if-no-files-found: warn
